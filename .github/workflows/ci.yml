name: Polaris CI

on:
  push:
    branches: [main]
    paths:
      - "Polaris API/**"
      - "Polaris WEB/**"
      - "Polaris Programa PC/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
    paths:
      - "Polaris API/**"
      - "Polaris WEB/**"
      - "Polaris Programa PC/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: polaris-node-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node clients + Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
