name: Polaris Release Artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches:
      - "release/0.9.0"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: polaris-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Web
        run: pnpm --dir "Polaris WEB" build
      - name: Package Web
        run: |
          cd "Polaris WEB"
          zip -r "../Polaris-WEB-0.9.0.zip" dist
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-web-0.9.0
          path: "Polaris-WEB-0.9.0.zip"
          if-no-files-found: error

  android:
    name: Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Polaris APP"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
      - name: Build APKs
        run: gradle :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Collect APKs
        run: |
          mkdir -p ../android-release
          cp app/build/outputs/apk/debug/app-debug.apk ../android-release/Polaris-0.9.0-debug.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../android-release/Polaris-0.9.0-release-unsigned.apk
          test -s ../android-release/Polaris-0.9.0-debug.apk
          test -s ../android-release/Polaris-0.9.0-release-unsigned.apk
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-android-0.9.0
          path: "android-release/*.apk"
          if-no-files-found: error

  desktop:
    name: Desktop ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle_glob: "Polaris Programa PC/src-tauri/target/release/bundle/**"
          - os: windows-latest
            bundle_glob: "Polaris Programa PC/src-tauri/target/release/bundle/**"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - name: Generate native desktop icons
        working-directory: "Polaris Programa PC"
        run: pnpm icon
      - name: Verify native desktop icons
        working-directory: "Polaris Programa PC"
        shell: bash
        run: |
          test -s src-tauri/icons/32x32.png
          test -s src-tauri/icons/128x128.png
          test -s src-tauri/icons/128x128@2x.png
          test -s src-tauri/icons/icon.ico
          test -s src-tauri/icons/icon.icns
      - name: Build native desktop bundle
        working-directory: "Polaris Programa PC"
        run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-desktop-${{ runner.os }}-0.9.0
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.head_ref == 'release/0.9.0' || github.ref == 'refs/heads/release/0.9.0' || startsWith(github.ref, 'refs/tags/v')
    needs: [web, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: List release assets
        run: find release-assets -type f -maxdepth 5 -print
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.9.0' }}
          generate_release_notes: true
          files: |
            release-assets/**/*.zip
            release-assets/**/*.apk
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.rpm
            release-assets/**/*.msi
            release-assets/**/*.exe
