[package]
name = "polaris-desktop"
version = "0.1.0"
description = "Polaris IA desktop client"
authors = ["Profetas del Código"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "polaris_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = "2"

[dependencies]
keyring = "3"
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
