services:
  - type: web
    name: polaris-api
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --dir "Polaris API" build
    startCommand: corepack enable && pnpm --dir "Polaris API" start
    healthCheckPath: /v1/health
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: HOST
        value: "0.0.0.0"
      - key: SUPABASE_URL
        value: "https://wkaynoafhjtqkhuvknzf.supabase.co"
      - key: SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_-g_KBSi4qj8ZbY2CRrsuvg_TwNmamDV"
      - key: AI_PROVIDER
        value: "openai"
      - key: AI_MODEL
        value: "gpt-5.6-terra"
      - key: REQUEST_RATE_LIMIT_MAX
        value: "30"
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: static
    name: polaris-web
    branch: main
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --dir "Polaris WEB" build
    staticPublishPath: "Polaris WEB/dist"
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: VITE_POLARIS_API_URL
        value: "https://polaris-api-959h.onrender.com"
      - key: VITE_SUPABASE_URL
        value: "https://wkaynoafhjtqkhuvknzf.supabase.co"
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: "sb_publishable_-g_KBSi4qj8ZbY2CRrsuvg_TwNmamDV"
